[project]
name = "airbank-rag-assistant"
version = "1.2.0"
description = "Portfolio RAG assistant over public Air Bank information with reproducible retrieval and answer evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "numpy>=2.1,<3",
    "openai>=2,<3",
    "pydantic>=2.11,<3",
    "pymupdf>=1.26,<2",
    "pydantic-ai-slim[openai]>=1,<2",
    "pydantic-settings>=2.10,<3",
    "streamlit>=1.49,<2",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
